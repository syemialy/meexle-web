# Site settings
# baseurl = "http://localhost:1313/"
languageCode = "en-us"
title = "Meexle — AI Engineering for Healthcare"
theme = "hugo-agency-theme"


[params]

	name = "Sergei Emelianov"
	description = "Meexle is an AI engineering and data protection company focused on healthcare. We design, build, and operate HIPAA-compliant AI systems that help clinical organizations improve outcomes, automate workflows, and protect sensitive health data."
	email = "meexle@meexle.com"


	# Navigation
	[params.navigation]
		brand = "meexle"
		synctool = "Services"
		about = "Process"
		team = "Team"
		example = "Ecosystem"
		casestudy = "Case Study"
		research = "Research"
		contact = "Contact"


	# Hero section
	[params.hero]
		# To change the background image of the hero, replace 'header-bg.jpg' in
		# the 'static/img' folder.
		title = "AI Engineering for Healthcare"
		subtitle = "Production AI for hospitals, health systems, and digital-health operators."
		buttonText = "Work With Us"


	# Services section
	[params.synctool]
		title = "What We Do"
		subtitle = "We build AI systems that healthcare organizations can trust — engineered for clinical accuracy, protected by design, and compliant by default."

		[[params.synctool.list]]
			icon = "fa-line-chart"
			title = "Predictive Analytics & Forecasting"
			description = "ML models for readmission risk, patient deterioration, population health, and revenue forecasting — delivered inside the workflows your clinicians and admins already use."

		[[params.synctool.list]]
			icon = "fa-sitemap"
			title = "AI Agents & Integrations"
			description = "Autonomous agents that act inside EHR and EMR: triage, prior authorization, scheduling, documentation, and cross-system data orchestration."

		[[params.synctool.list]]
			icon = "fa-cogs"
			title = "Model Fine-Tuning"
			description = "Foundation models adapted to your proprietary clinical data — speaking your specialty, following your protocols, performing on your patient population."

		[[params.synctool.list]]
			icon = "fa-shield"
			title = "Health Data Protection"
			description = "HIPAA-compliant pipelines for PHI: de-identification, encryption at rest and in transit, full audit trail across every system that touches patient data."

		[[params.synctool.list]]
			icon = "fa-stethoscope"
			title = "Clinical NLP"
			description = "Structured intelligence extracted from EHR notes, discharge summaries, and radiology reports — using NLP models purpose-built for clinical language."

		[[params.synctool.list]]
			icon = "fa-certificate"
			title = "Compliance & AI Governance"
			description = "Every model auditable, explainable, defensible — HIPAA, HITRUST, SOC 2, and emerging AI governance standards built into the system from day one."

    # About section
	[params.about]
		title = "How We Work"
		subtitle = "A clear, collaborative process — from first conversation to production AI"

		# Three-step process: Discover → Design & Build → Deploy & Protect.
		# Rendered as horizontal flow; titles + descriptions only (no images).
		[[params.about.events]]
			img = "discover.jpg"
			title = "Discover"
			description = "We start by understanding your clinical environment, data infrastructure, and goals. Together we identify the highest-value AI opportunities and define success criteria."

		[[params.about.events]]
			img = "design.jpg"
			title = "Design & Build"
			description = "Our engineers design a HIPAA-compliant AI architecture tailored to your organization. We build, test, and validate every component against clinical and regulatory requirements."

		[[params.about.events]]
			img = "deploy.jpg"
			title = "Deploy & Protect"
			description = "We deploy your AI system into production, integrate it with existing clinical workflows, and establish continuous monitoring, governance, and data protection protocols."


	# Team section
	[params.team]
		title = "Leadership"
		subtitle = "The people behind Meexle's healthcare AI engineering."

		[[params.team.members]]
			name = "Victor Bucha"
			role = "Chief Data Scientist & Co-Founder"
			initials = "VB"
			img = "victor.jpg"
			email = "victor@meexle.com"
			linkedin = "https://www.linkedin.com/in/bucha"
			bio = "20+ years leading R&D and engineering teams across deep-tech and applied AI — from Samsung's Galaxy and Smart TV product lines to enterprise computer-vision systems for European retail networks. PhD in Computer Vision, MBA, 15+ international patents and ~45 scientific publications. At Meexle, Victor leads AI architecture across predictive analytics, clinical NLP, and agentic workflows — including the firm's flagship engagement: an AI-agentic budgeting and variance-analytics platform currently in production rollout at a multi-facility US senior-care operator."


	# Technology Ecosystem section
	[params.example]
		title = "Technology Ecosystem"
		subtitle = "We build on the leading HIPAA-eligible cloud and AI platforms"
		description = "Our solutions integrate with the AI infrastructure your organization already relies on — or the best-fit platform for your needs."

		[[params.example.members]]
			img = "amazon-aws.png"
			name = "AWS HealthLake"
			position = "HIPAA-eligible health data lake with native FHIR support and Amazon SageMaker AI/ML capabilities"

		[[params.example.members]]
			img = "snowflake.svg"
			name = "Snowflake"
			position = "Cloud data platform for secure health data sharing, analytics, and AI/ML pipelines at scale"

		[[params.example.members]]
			img = "azure-ai-foundry.svg"
			name = "Azure AI Foundry"
			position = "Microsoft's enterprise AI platform for building, deploying, and governing healthcare AI solutions"


	# Case Study section
	[params.casestudy]
		title = "In Production"
		subtitle = "How Meexle delivers production AI for US healthcare operators."
		intro = "Our flagship engagement is an AI-agentic budgeting and variance-analytics platform for a multi-facility US senior-care operator. The system replaces manual GL and budget review with an agent-driven workflow currently in production rollout — driving live facility-level budgeting decisions across the operator's portfolio."
		dashboardImg = "dashboard.jpg"
		dashboardCaption = "Composite UI illustration. Anonymized — no real client data."
		# Pipeline diagram disabled — dashboard image alone carries the case study,
		# the flow diagram was a second-level detail that competed visually with
		# the dashboard above it. Uncomment to re-enable.
		# flowImg = "flow.jpg"
		# flowCaption = "From GL ingestion to facility-level actionable insights — the agentic pipeline behind the engagement."
		stack = "Stack: R · Snowflake · Power BI · Streamlit · agentic LLM orchestration. ~100K budget records and ~90K finance postings per facility per year."


	# Open Research section
	[params.research]
		title = "Open Research"
		subtitle = "Public datasets and tools we publish for the research community."

		[[params.research.items]]
			title = "MedScan — Medicare Part D Formulary Research"
			domain = "themedscan.com"
			url = "https://themedscan.com"
			screenshot = "medscan-teaser.png"
			description = "Longitudinal diff of every Medicare Part D formulary across the 8 largest PBM-affiliated carriers, plan years 2024–2026. Every tier move, prior-authorization addition, step-therapy and quantity-limit change — parsed from CMS-published files with full provenance. Free for researchers, journalists, advocacy organizations, and clinicians. No login, no monetization."


	# Contact section
	[params.contact]
		title = "Contact us"
		subtitle  = "We are open to comments and questions."
		buttonText = "Send message"

		# 'warning' defines error messages for invalid inputs
		[params.contact.form.fname]
			text = "Your First Name *"
			warning = "Please enter your fisrt name."
		
		[params.contact.form.lname]
			text = "Your Last Name *"
			warning = "Please enter your last name."

		[params.contact.form.company]
			text = "Company"
			warning = "Please enter your company name."

		[params.contact.form.email]
			text = "Your Email *"
			warning = "Please enter your email address."

		[params.contact.form.phone]
			text = "Your Phone"
			warning = "Please enter your phone number."

		[params.contact.form.message]
			text = "Your Message *"
			warning = "Please enter a message."


