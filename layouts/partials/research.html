{{ "<!-- Research Section -->" | safeHTML }}
<section id="research">
    <div class="container">
        <div class="row">
            <div class="col-lg-12 text-center">
                <h2 class="section-heading">{{ with .Site.Params.research.title }}{{ . }}{{ end }}</h2>
                <h3 class="section-subheading text-muted">{{ with .Site.Params.research.subtitle }}{{ . | markdownify }}{{ end }}</h3>
            </div>
        </div>
        <div class="row">
            {{ range .Site.Params.research.items }}
            <div class="col-md-10 col-md-offset-1">
                <div class="research-item" style="border-left:4px solid #fed136; padding:25px 30px; background:#fafafa; margin-bottom:25px;">
                    <h3 style="margin-top:0;">
                        <a href="{{ .url }}" target="_blank" rel="noopener" style="color:#222;">{{ .title }}</a>
                    </h3>
                    <p class="text-muted">{{ .description | markdownify }}</p>
                    <p style="margin-bottom:0;"><a href="{{ .url }}" target="_blank" rel="noopener" class="btn btn-default">Visit {{ .domain }} &rarr;</a></p>
                </div>
            </div>
            {{ end }}
        </div>
    </div>
</section>
