{{ "<!-- About / Process Section -->" | safeHTML }}
<section id="about" class="bg-light-gray">
    <div class="container">
        <div class="row">
            <div class="col-lg-12 text-center">
                <h2 class="section-heading">{{ with .Site.Params.about.title }}{{ . }}{{ end }}</h2>
                <h3 class="section-subheading text-muted">{{ with .Site.Params.about.subtitle }}{{ . | markdownify }}{{ end }}</h3>
            </div>
        </div>
        <div class="row process-flow">
            <div class="process-connector" aria-hidden="true"></div>
            {{ range $i, $e := .Site.Params.about.events }}
            <div class="col-md-4 process-step">
                <div class="process-step-inner">
                    <div class="process-step-icon">
                        <img src="img/about/{{ .img }}" alt="{{ .title }}" class="process-step-img">
                        <span class="process-step-badge">{{ add $i 1 }}</span>
                    </div>
                    <h4 class="process-step-title">{{ .title }}</h4>
                    <p class="process-step-desc text-muted">{{ .description | markdownify }}</p>
                </div>
            </div>
            {{ end }}
        </div>
    </div>
</section>
